<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Übungsvideo erstellen</title>
<style>
  :root {
    --text: #1f2a30;
    --muted: #6b7780;
    --line: #e3e8eb;
    --soft: #f6f8f9;
    --accent: #12a5c4;
    --accent-dark: #0d849d;
    --ok: #1f8a5b;
    --ok-dark: #18704a;
    --error: #c2412d;
    --dark: #0f171b;
    --h: 270px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  body { color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 4px; }
  .hidden { display: none !important; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

  /* Video-Feld */
  .drop {
    position: relative; height: var(--h);
    border: 1.5px dashed #cdd6db; border-radius: 12px; background: var(--soft);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    text-align: center; color: var(--muted); cursor: pointer; overflow: hidden;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: #eef9fb; }
  .drop svg { color: var(--accent); }
  .drop strong { color: var(--text); font-size: 15px; }
  .drop.has { border-style: solid; border-color: var(--dark); background: var(--dark); cursor: default; }
  .drop video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  input[type=file] { display: none; }
  .chip {
    position: absolute; right: 8px; bottom: 8px;
    font: inherit; font-size: 13px; font-weight: 600;
    background: rgba(255,255,255,.94); color: var(--text);
    border: 0; border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  .chip:hover { background: #fff; }

  /* Text-Feld */
  .textbox { position: relative; height: var(--h); }
  textarea {
    width: 100%; height: 100%; resize: none;
    font: inherit; color: inherit;
    border: 1.5px solid var(--line); border-radius: 12px;
    padding: 12px 14px 30px; background: #fff;
  }
  textarea::placeholder { color: #9aa5ab; }
  textarea:focus, .drop:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .count { position: absolute; left: 14px; right: 14px; bottom: 8px; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); pointer-events: none; }
  .count .warn { color: var(--error); }

  /* Buttons */
  button { font: inherit; cursor: pointer; }
  .big {
    width: 100%; margin-top: 12px; padding: 13px 18px;
    border: 0; border-radius: 10px;
    font-size: 16px; font-weight: 600; color: #fff; background: var(--accent);
  }
  .big:hover { background: var(--accent-dark); }
  .big:disabled { background: #c3ced3; cursor: not-allowed; }
  .big.download { background: var(--ok); }
  .big.download:hover { background: var(--ok-dark); }
  .link { background: none; border: 0; padding: 0; color: var(--accent-dark); font-size: 13px; font-weight: 500; }
  .link:hover { text-decoration: underline; }
  a.link { text-decoration: none; }

  .status { margin: 8px 0 0; font-size: 13px; color: var(--muted); text-align: center; min-height: 19px; }
  .status.error { color: var(--error); }
  .ok { color: var(--ok); font-weight: 500; }
  .actions { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; margin-top: 12px; }
  .actions .big { margin-top: 0; }
  .big.secondary { background: #fff; color: var(--text); border: 1.5px solid #cdd6db; }
  .big.secondary:hover { background: var(--soft); border-color: var(--accent); color: var(--accent-dark); }
  @media (max-width: 560px) { .actions { grid-template-columns: 1fr; } #download { order: -1; } }

  /* Ergebnis */
  .stage { position: relative; height: calc(var(--h) + 12px); border-radius: 12px; overflow: hidden; background: var(--dark); }
  .stage video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .rec {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 10px 14px 12px; color: #fff;
    background: linear-gradient(transparent, rgba(0,0,0,.75) 35%);
    font-size: 13px;
  }
  .rec-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .rec .link { color: #fff; opacity: .85; }
  .bar { height: 5px; background: rgba(255,255,255,.25); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; width: 0; background: #fff; transition: width .2s linear; }
  .wait { margin-top: 12px; padding: 13px 18px; text-align: center; font-size: 14px; color: var(--muted); background: var(--soft); border-radius: 10px; }

  #recCanvas { position: fixed; right: 0; bottom: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Eingabe: Video + Anleitung -->
  <div id="editView">
    <div class="grid">
      <label class="drop" id="drop" tabindex="0">
        <input type="file" id="videoInput" accept="video/*">
        <span id="dropHint">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="m15.5 10.5 6-3.5v10l-6-3.5"/></svg>
          <br><strong>Video aus Teil A</strong><br>auswählen oder hierher ziehen
        </span>
        <video id="video" class="hidden" muted playsinline loop></video>
        <button type="button" class="chip hidden" id="changeVideo">Anderes Video</button>
      </label>
      <div class="textbox">
        <textarea id="text" placeholder="Anleitung aus Teil B hier einfügen …"></textarea>
        <div class="count"><span id="wordCount">0 Wörter</span><span id="duration"></span></div>
      </div>
    </div>
    <button id="speak" class="big" disabled>Video erstellen</button>
    <p class="status" id="status"></p>
  </div>

  <!-- Ergebnis: fertiges Video -->
  <div id="resultView" class="hidden">
    <div class="stage">
      <video id="stage" playsinline></video>
      <div class="rec hidden" id="rec">
        <div class="rec-row"><span id="recText">Video wird erstellt …</span><button class="link" id="cancel">Abbrechen</button></div>
        <div class="bar"><div id="recBar"></div></div>
      </div>
    </div>
    <div class="wait" id="waitNote">Das Video läuft einmal mit Stimme durch und wird dabei aufgenommen – Fenster bitte offen lassen.</div>
    <div class="actions" id="resultActions">
      <button class="big secondary" id="back">← Video oder Text ändern</button>
      <button id="download" class="big download hidden">⬇ Fertiges Video herunterladen</button>
    </div>
    <p class="status" id="afterDownload"></p>
  </div>

</div>
<canvas id="recCanvas" aria-hidden="true"></canvas>

<script>
  const API_KEY = "__ELEVENLABS_KEY__";
  const VOICE_ID = "EXAVITQu4vr4xnSDxMaL";       // Sarah: ruhig und klar, spricht gut Deutsch
  const MODEL_ID = "eleven_multilingual_v2";

  const $ = (id) => document.getElementById(id);
  const video = $("video"), stage = $("stage"), canvas = $("recCanvas"), text = $("text"), drop = $("drop");
  const inFrame = (() => { try { return window.self !== window.top; } catch { return true; } })();

  let videoUrl = null;
  let audioBuffer = null, audioKey = null;          // letzte Vertonung (gleicher Text = keine neuen Zeichen)
  let finalUrl = null, finalExt = "mp4", finalSecs = 0, doneSnapshot = null;
  let phase = "idle";                                // idle | voicing | recording | done
  let view = "edit";                                 // edit | result
  let message = null;
  let session = null;
  let actx = null;

  // ---------- Video ----------
  $("videoInput").addEventListener("change", (e) => setVideo(e.target.files[0]));
  ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => setVideo(e.dataTransfer.files[0]));
  drop.addEventListener("click", (e) => { if (videoUrl && e.target !== $("videoInput")) e.preventDefault(); });   // mit Video: nur über „Anderes Video“
  drop.addEventListener("keydown", (e) => { if (!videoUrl && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); $("videoInput").click(); } });
  $("changeVideo").addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); $("videoInput").value = ""; $("videoInput").click(); });

  function setVideo(file) {
    if (!file) return;
    if (!/^video\//.test(file.type) && !/\.(mov|mp4|m4v|webm)$/i.test(file.name)) { setMessage("Das ist keine Videodatei.", "error"); return; }
    if (videoUrl) URL.revokeObjectURL(videoUrl);
    videoUrl = URL.createObjectURL(file);
    video.src = videoUrl;
    video.classList.remove("hidden");
    video.play().catch(() => {});
    $("dropHint").classList.add("hidden");
    $("changeVideo").classList.remove("hidden");
    drop.classList.add("has");
    message = null;
    render();
  }
  video.addEventListener("error", () => { if (video.getAttribute("src")) setMessage("Dieses Videoformat kann der Browser nicht abspielen – bitte als MP4 exportieren oder Safari nutzen.", "error"); });

  // ---------- Text ----------
  text.addEventListener("input", () => { message = null; render(); });
  const wordCount = () => (text.value.trim() ? text.value.trim().split(/\s+/).length : 0);
  const snapshot = () => text.value.trim() + "|" + videoUrl;

  // ---------- Anzeige ----------
  function render() {
    const words = wordCount();
    $("wordCount").textContent = words + " / 100 Wörter";
    $("wordCount").className = words > 100 ? "warn" : "";
    $("duration").textContent = words ? "ca. " + Math.round(words / 2.2) + " Sek." : "";

    const hasVideo = !!videoUrl, hasText = words > 0;
    const stale = !!finalUrl && snapshot() !== doneSnapshot;

    $("editView").classList.toggle("hidden", view !== "edit");
    $("resultView").classList.toggle("hidden", view !== "result");

    const speak = $("speak");
    speak.disabled = !(hasVideo && hasText) || phase === "voicing";
    speak.textContent = phase === "voicing" ? "Stimme wird erzeugt …" : finalUrl ? "Video neu erstellen" : "Video erstellen";

    const st = $("status");
    st.className = "status" + (message?.cls ? " " + message.cls : "");
    st.innerHTML = "";
    if (message) st.textContent = message.text;
    else if (!hasVideo || !hasText) st.textContent = !hasVideo && !hasText ? "Lade dein Video hoch und füge deine Anleitung ein." : !hasVideo ? "Jetzt noch dein Video hochladen." : "Jetzt noch deine Anleitung einfügen.";
    else if (finalUrl && !stale) {
      const b = document.createElement("button");
      b.className = "link"; b.textContent = "Zum fertigen Video →";
      b.onclick = () => { view = "result"; render(); };
      st.appendChild(b);
    } else if (finalUrl && stale) st.textContent = "Du hast etwas geändert – erstelle das Video neu.";

    const recording = phase === "recording";
    $("rec").classList.toggle("hidden", !recording);
    $("waitNote").classList.toggle("hidden", !recording);
    $("download").classList.toggle("hidden", recording || !finalUrl);
    $("resultActions").classList.toggle("hidden", recording);
    $("afterDownload").classList.toggle("hidden", recording);
    if (finalUrl) $("download").textContent = "⬇ Fertiges Video herunterladen (" + finalSecs + " Sek.)";
  }
  function setMessage(t, cls) { message = { text: t, cls }; render(); }

  // ---------- Vertonen & aufnehmen ----------
  function audioCtx() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume().catch(() => {});
    return actx;
  }

  $("speak").addEventListener("click", async () => {
    message = null;
    const ctx = audioCtx(); // im Klick anlegen, damit der Browser den Ton freigibt
    try {
      const want = text.value.trim();
      if (!audioBuffer || want !== audioKey) {
        phase = "voicing"; render();
        const res = await fetch("https://api.elevenlabs.io/v1/text-to-speech/" + VOICE_ID + "?output_format=mp3_44100_128", {
          method: "POST",
          headers: { "xi-api-key": API_KEY, "Content-Type": "application/json", "Accept": "audio/mpeg" },
          body: JSON.stringify({ text: want, model_id: MODEL_ID }),
        });
        if (!res.ok) throw new Error(await apiError(res));
        audioBuffer = await ctx.decodeAudioData(await (await res.blob()).arrayBuffer());
        audioKey = want;
      }
      await record();
    } catch (e) {
      phase = finalUrl ? "done" : "idle"; view = "edit";
      setMessage("Das hat nicht geklappt: " + e.message, "error");
    }
  });

  async function apiError(res) {
    let detail = "";
    try { const j = await res.json(); detail = j.detail?.message || j.detail?.status || (typeof j.detail === "string" ? j.detail : ""); } catch {}
    if (res.status === 401) return "Zugang zur Stimme fehlt (API-Key)";
    if (res.status === 429) return "Kontingent für die Stimme aufgebraucht";
    return "Fehler " + res.status + (detail ? ": " + detail : "");
  }

  function pickMime() {
    if (!window.MediaRecorder) return null;
    return ["video/mp4;codecs=avc1.640028,mp4a.40.2", "video/mp4;codecs=avc1,mp4a.40.2", "video/mp4",
            "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"]
      .find(t => MediaRecorder.isTypeSupported(t)) || "";
  }

  function waitReady(v) {
    if (v.readyState >= 2) return Promise.resolve();
    return new Promise((resolve, reject) => {
      v.addEventListener("loadeddata", resolve, { once: true });
      v.addEventListener("error", () => reject(new Error("Video konnte nicht geladen werden")), { once: true });
    });
  }

  // Das Video läuft in Schleife, bis die Stimme fertig ist, und endet in der Startstellung.
  // Bild (Canvas) und Stimme (Web Audio) werden dabei gemeinsam aufgenommen.
  async function record() {
    abortRecording();
    const mime = pickMime();
    if (mime === null || !canvas.captureStream) throw new Error("Dieser Browser kann kein Video erstellen – bitte Safari oder Chrome nutzen.");
    const ctx = audioCtx();
    const snap = snapshot();
    video.pause();

    phase = "recording"; view = "result"; render();
    $("recBar").style.width = "0";
    $("recText").textContent = "Video wird erstellt …";
    stage.controls = false; stage.muted = true; stage.loop = true;
    stage.src = videoUrl;
    await waitReady(stage);

    const vw = stage.videoWidth, vh = stage.videoHeight;
    const scale = Math.min(1, 1920 / Math.max(vw, vh), 1080 / Math.min(vw, vh)); // höchstens Full HD
    const w = Math.round(vw * scale / 2) * 2, h = Math.round(vh * scale / 2) * 2;
    canvas.width = w; canvas.height = h;
    const g = canvas.getContext("2d");
    g.drawImage(stage, 0, 0, w, h);

    const vDur = isFinite(stage.duration) && stage.duration > 0 ? stage.duration : audioBuffer.duration;
    const total = Math.max(1, Math.ceil(audioBuffer.duration / vDur - 0.01)) * vDur;

    const dest = ctx.createMediaStreamDestination();
    const src = ctx.createBufferSource();
    src.buffer = audioBuffer;
    src.connect(dest);
    src.connect(ctx.destination); // gleichzeitig hörbar

    const stream = canvas.captureStream(30);
    dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    const opts = { videoBitsPerSecond: 8000000, audioBitsPerSecond: 128000 };
    if (mime) opts.mimeType = mime;
    const recorder = new MediaRecorder(stream, opts);
    const chunks = [];
    recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };

    return new Promise((resolve) => {
      const s = { recorder, src, drawing: true, aborted: false, done: resolve, startAt: 0 };
      session = s;

      const draw = () => {
        if (!s.drawing) return;
        g.drawImage(stage, 0, 0, w, h);
        const t = Math.max(0, ctx.currentTime - s.startAt);
        $("recBar").style.width = Math.min(100, t / total * 100) + "%";
        $("recText").textContent = "Video wird erstellt … " + Math.min(Math.round(t), Math.round(total)) + " von " + Math.round(total) + " Sek.";
        requestAnimationFrame(draw);
      };

      src.onended = () => { if (session === s) stage.loop = false; };   // Stimme fertig → Wiederholung zu Ende
      s.onStageEnded = () => {                                         // Startstellung erreicht → Ende
        g.drawImage(stage, 0, 0, w, h);
        s.endAt = ctx.currentTime;
        setTimeout(() => { s.drawing = false; if (recorder.state !== "inactive") recorder.stop(); }, 250);
      };

      recorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        if (s.aborted) { resolve(); return; }
        session = null;
        const type = (recorder.mimeType || mime || "video/webm").split(";")[0];
        finalExt = type.includes("mp4") ? "mp4" : "webm";
        finalSecs = Math.round((s.endAt || ctx.currentTime) - s.startAt);
        if (finalUrl) URL.revokeObjectURL(finalUrl);
        finalUrl = URL.createObjectURL(new Blob(chunks, { type }));
        stage.loop = false; stage.muted = false; stage.controls = true;
        stage.src = finalUrl;
        phase = "done"; doneSnapshot = snap;
        $("afterDownload").textContent = "";
        render();
        resolve();
      };

      recorder.start(1000);
      stage.currentTime = 0;
      stage.play().then(() => {
        s.startAt = ctx.currentTime;
        src.start();
        requestAnimationFrame(draw);
      }).catch(() => {
        abortRecording();
        phase = finalUrl ? "done" : "idle"; view = "edit";
        setMessage("Abspielen wurde blockiert – klick nochmal auf „Video erstellen“.", "error");
      });
    });
  }

  function abortRecording() {
    const s = session;
    if (!s) return;
    session = null;
    s.aborted = true;
    s.drawing = false;
    try { s.src.stop(); } catch {}
    if (s.recorder.state !== "inactive") s.recorder.stop(); else s.done();
    stage.pause();
  }

  stage.addEventListener("ended", () => { if (session && session.onStageEnded) session.onStageEnded(); });

  $("cancel").addEventListener("click", () => {
    abortRecording();
    phase = finalUrl ? "done" : "idle"; view = "edit";
    if (finalUrl) { stage.src = finalUrl; stage.controls = true; stage.muted = false; stage.loop = false; }
    video.play().catch(() => {});
    setMessage("Abgebrochen – ein neuer Versuch kostet nichts extra.");
  });

  $("back").addEventListener("click", () => {
    stage.pause();
    view = "edit"; message = null;
    video.play().catch(() => {});
    render();
  });

  $("download").addEventListener("click", () => {
    if (!finalUrl) return;
    const a = document.createElement("a");
    a.href = finalUrl; a.download = "uebungsvideo." + finalExt;
    document.body.appendChild(a); a.click(); a.remove();
    const after = $("afterDownload");
    after.innerHTML = "";
    const ok = document.createElement("span");
    ok.className = "ok"; ok.textContent = "✓ Heruntergeladen – jetzt unten in Notion hochladen";
    after.appendChild(ok);
    if (inFrame) {
      const a2 = document.createElement("a");
      a2.className = "link"; a2.href = location.href; a2.target = "_blank"; a2.rel = "noopener";
      a2.textContent = " · Nichts passiert? In neuem Tab öffnen";
      after.appendChild(a2);
    }
  });

  render();
</script>
</body>
</html>
